services:
  - type: web
    name: flowdesk-api
    runtime: node
    rootDir: backend
    # `prisma db push` applies the schema on every deploy. This project has no
    # migrations directory, so without it a deploy that adds a model ships code
    # querying a table the database doesn't have. It is additive and idempotent
    # — an unchanged schema is a no-op.
    # `db:backfill-assignees` gives every pre-existing task its TaskAssignee row.
    # It runs on every deploy and is idempotent (unique constraint +
    # skipDuplicates), which is the point: the join table is only safe to read
    # from once EVERY task has a row, and a deploy that skipped it would make
    # workers' own tasks disappear from WhatsApp.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --skip-generate && npm run db:backfill-assignees && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── WhatsApp (Meta Cloud API) ──────────────────────────────────────
      - key: META_PHONE_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      # Enables X-Hub-Signature-256 verification on the webhook. Without it the
      # endpoint accepts unsigned payloads — anyone who finds the URL could post
      # fake worker replies and change task statuses.
      - key: META_APP_SECRET
        sync: false

      # ── Media + transcription ──────────────────────────────────────────
      # Without CLOUDINARY_*, photos are never stored, so nothing auto-approves.
      # Without GROQ_API_KEY, voice notes are never transcribed — and since the
      # transcript is what identifies the task, they can't be routed at all.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # ── Intent detection (NVIDIA NIM) ──────────────────────────────────
      # Without NVIDIA_API_KEY the service still works, falling back to
      # multilingual keyword matching plus regex task-number extraction.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_INTENT_MODEL
        value: meta/llama-3.1-8b-instruct

      # ── WhatsApp management commands ───────────────────────────────────
      # Lets a manager run the board from WhatsApp ("Allocate TSK-1059 to
      # Vikranth"), by text or voice note.
      #
      # `sync: false` rather than a literal value on purpose: this is set in the
      # Render dashboard per client, so enabling it for one deployment isn't
      # undone by the next blueprint sync. It defaults to OFF in code, so a
      # service that never sets it keeps behaving exactly as it does today.
      #
      # DO NOT enable this without META_APP_SECRET also set. Unsigned webhooks
      # are accepted when that is missing, which with commands live means anyone
      # who finds the URL can reassign tickets as any registered manager.
      - key: WA_COMMANDS_ENABLED
        sync: false
      - key: WA_COMMAND_ROLES
        value: Manager,Admin
      # How long a "which Vikranth did you mean?" stays answerable, in seconds.
      - key: WA_STATE_TTL_S
        value: "600"
      # Blast-radius cap per sender — limits what a stolen phone can rewrite.
      - key: WA_COMMAND_RATE_LIMIT
        value: "20"
      - key: WA_COMMAND_RATE_WINDOW_S
        value: "600"
      # Raise above 0.9 to make every AI-parsed command ask before acting.
      - key: WA_CONFIDENCE_THRESHOLD
        value: "0.9"

      # ── Escalation ─────────────────────────────────────────────────────
      - key: ESCALATION_INTERVALS_HOURS
        value: "0,24,48"
      - key: MAX_ESCALATION_LEVEL
        value: "4"

      - key: FRONTEND_URL
        sync: false
